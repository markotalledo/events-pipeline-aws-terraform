[project]
name = "events-pipeline-aws-terraform"
version = "0.1.0"
description = "Serverless event ingestion on AWS (API Gateway, Lambda, Firehose, S3) with Terraform, a synthetic data generator and a cost model."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopgen", "src/costmodel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
